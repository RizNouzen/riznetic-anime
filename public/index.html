<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIZNETIC - Nonton Anime Sub Indo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #030610; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #080d1a; }
        ::-webkit-scrollbar-thumb { background: #1c283a; border-radius: 4px; }
        .glass { background: rgba(16, 23, 38, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-6px) scale(1.02); }
        .glow-effect { box-shadow: 0 0 20px rgba(0, 242, 254, 0.25); }
        .animate-fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hero-gradient { background: linear-gradient(90deg, #030610 30%, rgba(3,6,16,0.85) 60%, rgba(3,6,16,0.3) 100%), linear-gradient(0deg, #030610 0%, rgba(3,6,16,0) 50%); }
    </style>
</head>
<body>
    <div class="flex flex-col md:flex-row h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="fixed bottom-0 left-0 right-0 md:relative h-14 md:h-screen w-full md:w-16 bg-navy-900 border-t md:border-t-0 md:border-r border-navy-800/80 flex flex-row md:flex-col items-center justify-around md:justify-between py-1.5 md:py-4 z-50 shrink-0 shadow-2xl">
            <a href="#" onclick="showPage('home')" class="hidden md:flex flex-col items-center group">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-accent-cyan to-blue-600 flex items-center justify-center font-extrabold text-black text-sm shadow glow-effect">R</div>
                <span class="text-[9px] font-bold tracking-wider text-accent-cyan mt-1">RIZ</span>
            </a>
            <nav class="flex flex-row md:flex-col gap-1 md:gap-4 items-center justify-around w-full md:w-auto">
                <button onclick="showPage('home')" id="nav-home" class="nav-btn text-accent-cyan transition p-2 md:p-2.5 rounded-xl relative group flex flex-col items-center">
                    <i class="fa-solid fa-house text-base md:text-lg"></i>
                    <span class="text-[8px] md:hidden mt-0.5 font-medium">Beranda</span>
                </button>
                <button onclick="showPage('genre')" id="nav-genre" class="nav-btn text-gray-400 hover:text-accent-cyan transition p-2 md:p-2.5 rounded-xl relative group flex flex-col items-center">
                    <i class="fa-solid fa-tags text-base md:text-lg"></i>
                    <span class="text-[8px] md:hidden mt-0.5 font-medium">Genre</span>
                </button>
                <button onclick="showPage('popular')" id="nav-popular" class="nav-btn text-gray-400 hover:text-accent-cyan transition p-2 md:p-2.5 rounded-xl relative group flex flex-col items-center">
                    <i class="fa-solid fa-fire text-base md:text-lg"></i>
                    <span class="text-[8px] md:hidden mt-0.5 font-medium">Populer</span>
                </button>
                <button onclick="showPage('latest')" id="nav-latest" class="nav-btn text-gray-400 hover:text-accent-cyan transition p-2 md:p-2.5 rounded-xl relative group flex flex-col items-center">
                    <i class="fa-solid fa-bolt text-base md:text-lg"></i>
                    <span class="text-[8px] md:hidden mt-0.5 font-medium">Terbaru</span>
                </button>
            </nav>
            <div class="hidden md:flex flex-col gap-2 items-center">
                <button onclick="loadHome()" class="text-gray-400 hover:text-accent-cyan transition p-2 rounded-xl">
                    <i class="fa-solid fa-rotate-right text-base"></i>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 overflow-y-auto relative hide-scroll pb-20 md:pb-12" id="main-container">
            
            <!-- HEADER -->
            <header class="sticky top-0 z-30 px-4 md:px-6 py-3 glass flex justify-between items-center border-b border-navy-800/40">
                <div class="flex items-center gap-3 cursor-pointer" onclick="showPage('home')">
                    <h1 class="text-lg md:text-xl font-black tracking-wider text-white">RIZ<span class="text-accent-cyan">NETIC</span></h1>
                    <span class="text-[10px] bg-accent-cyan/10 text-accent-cyan px-2 py-0.5 rounded-full border border-accent-cyan/20 font-bold hidden lg:inline-block">Sub Indo</span>
                </div>
                <form onsubmit="submitSearch(event)" class="relative w-44 sm:w-64 md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="search-input" placeholder="Cari anime..." 
                        class="w-full bg-navy-950/90 border border-navy-700/80 rounded-full py-1.5 md:py-2 pl-8 md:pl-10 pr-12 md:pr-16 text-xs md:text-sm text-white placeholder-gray-400 focus:outline-none focus:border-accent-cyan transition shadow-inner">
                    <button type="submit" class="absolute right-1 top-1/2 -translate-y-1/2 text-[10px] md:text-xs bg-accent-cyan text-black px-2.5 md:px-3.5 py-1 rounded-full font-extrabold hover:bg-white transition">Cari</button>
                </form>
            </header>

            <!-- PAGE CONTENT -->
            <div id="page-content" class="p-4 md:p-6">
                <div id="loading-spinner" class="flex flex-col items-center justify-center min-h-[50vh]">
                    <div class="w-10 h-10 border-4 border-accent-cyan border-t-transparent rounded-full animate-spin"></div>
                    <p class="mt-3 text-xs font-medium text-gray-400">Memuat Anime Sub Indo...</p>
                </div>

                <!-- HOME -->
                <div id="view-home" class="space-y-6 hidden">
                    <section id="hero-section" class="relative rounded-2xl overflow-hidden min-h-[300px] flex items-end border border-navy-800 shadow-2xl bg-navy-900">
                        <div id="hero-bg" class="absolute inset-0 bg-cover bg-center"></div>
                        <div class="absolute inset-0 hero-gradient"></div>
                        <div class="relative z-10 p-5 md:p-10 max-w-2xl space-y-3">
                            <div class="flex items-center gap-2.5">
                                <span class="bg-red-600 text-white text-[9px] font-black uppercase px-2 py-0.5 rounded">SPOTLIGHT</span>
                                <span id="hero-status" class="text-xs text-gray-300 bg-navy-800/80 px-2 py-0.5 rounded">Ongoing</span>
                            </div>
                            <h2 id="hero-title" class="text-2xl md:text-4xl font-extrabold text-white leading-tight">Loading...</h2>
                            <button id="hero-play-btn" class="bg-gradient-to-r from-accent-cyan to-blue-500 text-black font-extrabold px-5 py-2.5 rounded-xl text-xs flex items-center gap-2 hover:opacity-90 transition shadow-lg glow-effect">
                                <i class="fa-solid fa-play"></i> Nonton Episode Terbaru
                            </button>
                        </div>
                    </section>

                    <section>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-base font-bold text-white">📺 Rilis Episode Terbaru</h3>
                            <button onclick="showPage('latest')" class="text-xs text-accent-cyan hover:underline font-semibold">Lihat Semua →</button>
                        </div>
                        <div id="grid-latest" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
                    </section>

                    <section>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-base font-bold text-white">🔥 Tamat / Populer</h3>
                            <button onclick="showPage('popular')" class="text-xs text-accent-cyan hover:underline font-semibold">Lihat Semua →</button>
                        </div>
                        <div id="grid-popular" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
                    </section>
                </div>

                <!-- GENRE -->
                <div id="view-genre" class="space-y-5 hidden">
                    <h2 class="text-lg font-bold text-white">🎯 Genre Anime</h2>
                    <div id="genre-buttons" class="flex flex-wrap gap-2"></div>
                    <div id="genre-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
                </div>

                <!-- GRID (Popular, Latest, Search) -->
                <div id="view-grid" class="space-y-5 hidden">
                    <h2 id="grid-title" class="text-lg font-bold text-white">Daftar Anime</h2>
                    <div id="grid-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
                </div>

                <!-- WATCH -->
                <div id="view-watch" class="space-y-5 hidden">
                    <div class="flex justify-between items-center bg-navy-900 p-3 rounded-2xl border border-navy-800">
                        <button onclick="showPage('home')" class="text-xs font-bold text-gray-300 hover:text-accent-cyan bg-navy-800 px-3 py-1.5 rounded-xl border border-navy-700">
                            ← Kembali
                        </button>
                        <h2 id="watch-title" class="text-xs md:text-base font-bold text-white truncate max-w-xs text-center">Loading...</h2>
                    </div>
                    <div class="aspect-video w-full bg-black rounded-2xl overflow-hidden border border-navy-700 shadow-2xl glow-effect flex items-center justify-center">
                        <iframe id="watch-iframe" class="w-full h-full border-0 hidden" allowfullscreen></iframe>
                        <p id="player-loading" class="text-accent-cyan text-sm font-bold animate-pulse">⏳ Memuat Video Sub Indo...</p>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                        <div class="lg:col-span-2 glass p-4 rounded-2xl border border-navy-800">
                            <h4 class="text-sm font-bold text-white mb-3">📋 Daftar Episode</h4>
                            <div id="episodes-list" class="flex flex-col gap-2 max-h-56 overflow-y-auto"></div>
                        </div>
                        <div class="glass p-4 rounded-2xl border border-navy-800">
                            <h4 class="text-sm font-bold text-white mb-3">📝 Detail Anime</h4>
                            <div id="detail-content" class="text-xs text-gray-300 space-y-2">
                                <p><strong>Rating:</strong> <span id="detail-score">-</span></p>
                                <p><strong>Status:</strong> <span id="detail-status">-</span></p>
                                <p><strong>Genre:</strong> <span id="detail-genres">-</span></p>
                                <p class="pt-2 border-t border-navy-800"><strong>Sinopsis:</strong></p>
                                <p id="detail-synopsis" class="text-gray-400 text-[11px] leading-relaxed">-</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // PAKE ANILIST API LANGSUNG (Client-side)
        // ==========================================
        const ANILIST_API = 'https://graphql.anilist.co';
        let currentAnimeId = null;
        let currentEpisodeId = null;

        // ===== QUERY =====
        const SEARCH_QUERY = `
        query ($search: String, $page: Int) {
          Page(page: $page, perPage: 24) {
            media(search: $search, type: ANIME, sort: POPULARITY_DESC) {
              id
              title { romaji english native }
              coverImage { large }
              episodes
              averageScore
              status
              genres
              description
            }
          }
        }`;

        const DETAIL_QUERY = `
        query ($id: Int) {
          Media(id: $id, type: ANIME) {
            id
            title { romaji english native }
            coverImage { large }
            episodes
            averageScore
            status
            genres
            description
          }
        }`;

        // ===== FETCH FUNCTION =====
        async function fetchAniList(query, variables = {}) {
            try {
                const response = await fetch(ANILIST_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, variables })
                });
                const data = await response.json();
                return data.data;
            } catch (e) {
                console.error('Fetch error:', e);
                return null;
            }
        }

        // ===== TRANSFORM =====
        function transformAnime(item) {
            return {
                id: item.id,
                title: item.title?.romaji || item.title?.english || item.title?.native || 'Unknown',
                cover: item.coverImage?.large || '',
                episodes: item.episodes ? `Ep ${item.episodes}` : 'Ongoing',
                score: item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A',
                status: item.status || 'Ongoing',
                genres: item.genres ? item.genres.join(', ') : 'Anime',
                synopsis: item.description ? item.description.replace(/<[^>]*>/g, '').substring(0, 500) : 'Sinopsis tidak tersedia.'
            };
        }

        // ===== RENDER CARDS =====
        function renderCards(containerId, animeList) {
            const container = document.getElementById(containerId);
            if (!animeList || animeList.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-400 py-8">Tidak ada anime ditemukan.</p>`;
                return;
            }
            container.innerHTML = animeList.map(anime => `
                <div onclick="showDetail('${anime.id}')" class="card-hover cursor-pointer bg-navy-900 rounded-xl overflow-hidden border border-navy-800 shadow-lg">
                    <div class="aspect-[3/4] overflow-hidden bg-navy-950">
                        <img src="${anime.cover}" alt="${anime.title}" class="w-full h-full object-cover hover:scale-110 transition duration-500" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400?text=No+Image'">
                        ${anime.episodes ? `<div class="absolute bottom-1.5 left-1.5 bg-navy-900/90 text-accent-cyan text-[9px] font-bold px-1.5 py-0.5 rounded border border-accent-cyan/30">${anime.episodes}</div>` : ''}
                    </div>
                    <div class="p-2.5">
                        <h4 class="font-bold text-[11px] text-white line-clamp-2 hover:text-accent-cyan transition">${anime.title}</h4>
                    </div>
                </div>
            `).join('');
        }

        // ===== LOAD HOME =====
        async function loadHome() {
            document.getElementById('loading-spinner').classList.remove('hidden');
            try {
                const [page1, page2] = await Promise.all([
                    fetchAniList(SEARCH_QUERY, { search: '', page: 1 }),
                    fetchAniList(SEARCH_QUERY, { search: '', page: 2 })
                ]);
                
                const ongoing = (page1?.Page?.media || []).map(transformAnime);
                const popular = (page2?.Page?.media || []).map(transformAnime);
                
                renderCards('grid-latest', ongoing);
                renderCards('grid-popular', popular);
                
                // Hero
                if (ongoing.length > 0) {
                    const hero = ongoing[0];
                    document.getElementById('hero-title').innerText = hero.title;
                    document.getElementById('hero-status').innerText = hero.episodes;
                    document.getElementById('hero-bg').style.backgroundImage = `url('${hero.cover}')`;
                    document.getElementById('hero-play-btn').onclick = () => showDetail(hero.id);
                }
            } catch (e) {
                console.error('Home error:', e);
            }
            document.getElementById('loading-spinner').classList.add('hidden');
            showPage('home');
        }

        // ===== SHOW DETAIL =====
        async function showDetail(animeId) {
            currentAnimeId = animeId;
            showPage('watch');
            
            document.getElementById('watch-title').innerText = 'Memuat...';
            document.getElementById('episodes-list').innerHTML = '<p class="text-accent-cyan text-xs p-2">⏳ Memuat episode...</p>';
            document.getElementById('player-loading').classList.remove('hidden');
            document.getElementById('watch-iframe').classList.add('hidden');

            try {
                const data = await fetchAniList(DETAIL_QUERY, { id: parseInt(animeId) });
                const item = data?.Media;
                if (!item) throw new Error('No data');

                // Detail
                const detail = transformAnime(item);
                document.getElementById('watch-title').innerText = detail.title;
                document.getElementById('detail-score').innerText = detail.score;
                document.getElementById('detail-status').innerText = detail.status;
                document.getElementById('detail-genres').innerText = detail.genres;
                document.getElementById('detail-synopsis').innerText = detail.synopsis;

                // Episodes
                const epCount = item.episodes || 12;
                let epHtml = '';
                for (let i = 1; i <= Math.min(epCount, 50); i++) {
                    epHtml += `
                        <button onclick="playEpisode('${item.id}', ${i})" class="ep-btn w-full text-left bg-navy-800 hover:bg-navy-700 rounded-lg px-4 py-2.5 text-xs font-bold transition border border-navy-700 text-gray-300">
                            <i class="fa-solid fa-play text-accent-cyan mr-2 opacity-50"></i> Episode ${i} (Sub Indo)
                        </button>
                    `;
                }
                document.getElementById('episodes-list').innerHTML = epHtml;

                // Play episode 1
                playEpisode(item.id, 1);
            } catch (e) {
                document.getElementById('watch-title').innerText = 'Gagal memuat';
                document.getElementById('episodes-list').innerHTML = '<p class="text-red-400 text-xs p-2">❌ Gagal memuat episode</p>';
            }
        }

        // ===== PLAY EPISODE =====
        function playEpisode(animeId, episodeNum) {
            currentEpisodeId = `${animeId}-${episodeNum}`;
            
            // Highlight active episode
            document.querySelectorAll('.ep-btn').forEach(btn => {
                btn.className = 'ep-btn w-full text-left bg-navy-800 hover:bg-navy-700 rounded-lg px-4 py-2.5 text-xs font-bold transition border border-navy-700 text-gray-300';
            });
            
            // Video source SUB INDO
            const streamUrl = `https://vidsrc.cc/v2/embed/anime/${animeId}/${episodeNum}`;
            
            const iframe = document.getElementById('watch-iframe');
            iframe.src = streamUrl;
            iframe.onload = () => {
                document.getElementById('player-loading').classList.add('hidden');
                iframe.classList.remove('hidden');
            };
        }

        // ===== GENRE =====
        const GENRES = ['action', 'adventure', 'comedy', 'drama', 'fantasy', 'horror', 'isekai', 'romance', 'sci-fi', 'slice-of-life', 'sports', 'supernatural', 'thriller'];

        function renderGenreButtons() {
            const container = document.getElementById('genre-buttons');
            container.innerHTML = GENRES.map(g => `
                <button onclick="loadGenre('${g}')" class="bg-navy-900 hover:bg-accent-cyan hover:text-black text-gray-300 font-bold px-4 py-1.5 rounded-xl border border-navy-800 transition text-xs capitalize">
                    ${g}
                </button>
            `).join('');
        }

        async function loadGenre(genre) {
            document.getElementById('genre-container').innerHTML = `<div class="col-span-full text-accent-cyan py-8">⏳ Memuat genre ${genre}...</div>`;
            try {
                const data = await fetchAniList(SEARCH_QUERY, { search: genre, page: 1 });
                renderCards('genre-container', (data?.Page?.media || []).map(transformAnime));
            } catch (e) {
                document.getElementById('genre-container').innerHTML = `<p class="col-span-full text-red-400 py-8">❌ Gagal memuat genre</p>`;
            }
        }

        // ===== SEARCH =====
        async function submitSearch(e) {
            e.preventDefault();
            const q = document.getElementById('search-input').value.trim();
            if (!q) return;

            showPage('search');
            document.getElementById('grid-title').innerText = `🔍 Hasil: "${q}"`;
            document.getElementById('grid-container').innerHTML = `<div class="col-span-full text-accent-cyan py-8">⏳ Mencari...</div>`;

            try {
                const data = await fetchAniList(SEARCH_QUERY, { search: q, page: 1 });
                renderCards('grid-container', (data?.Page?.media || []).map(transformAnime));
            } catch (e) {
                document.getElementById('grid-container').innerHTML = `<p class="col-span-full text-red-400 py-8">❌ Gagal mencari</p>`;
            }
        }

        // ===== LOAD POPULAR =====
        async function loadPopular() {
            showPage('popular');
            document.getElementById('grid-title').innerText = '🔥 Anime Populer';
            document.getElementById('grid-container').innerHTML = `<div class="col-span-full text-accent-cyan py-8">⏳ Memuat...</div>`;
            try {
                const data = await fetchAniList(SEARCH_QUERY, { search: '', page: 2 });
                renderCards('grid-container', (data?.Page?.media || []).map(transformAnime));
            } catch (e) {
                document.getElementById('grid-container').innerHTML = `<p class="col-span-full text-red-400 py-8">❌ Gagal memuat</p>`;
            }
        }

        // ===== LOAD LATEST =====
        async function loadLatest() {
            showPage('latest');
            document.getElementById('grid-title').innerText = '📺 Episode Terbaru';
            document.getElementById('grid-container').innerHTML = `<div class="col-span-full text-accent-cyan py-8">⏳ Memuat...</div>`;
            try {
                const data = await fetchAniList(SEARCH_QUERY, { search: '', page: 1 });
                renderCards('grid-container', (data?.Page?.media || []).map(transformAnime));
            } catch (e) {
                document.getElementById('grid-container').innerHTML = `<p class="col-span-full text-red-400 py-8">❌ Gagal memuat</p>`;
            }
        }

        // ===== PAGE NAVIGATION =====
        function showPage(page) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('text-accent-cyan'));
            const navBtn = document.getElementById(`nav-${page}`);
            if (navBtn) navBtn.classList.add('text-accent-cyan');

            document.querySelectorAll('#view-home, #view-genre, #view-grid, #view-watch').forEach(el => el.classList.add('hidden'));
            
            if (page === 'home') document.getElementById('view-home').classList.remove('hidden');
            else if (page === 'genre') document.getElementById('view-genre').classList.remove('hidden');
            else if (page === 'popular') loadPopular();
            else if (page === 'latest') loadLatest();
            else if (page === 'search') document.getElementById('view-grid').classList.remove('hidden');
            else if (page === 'watch') document.getElementById('view-watch').classList.remove('hidden');
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            renderGenreButtons();
            loadHome();
        });
    </script>
</body>
</html>
